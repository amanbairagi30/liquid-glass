<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f8459"/>
      <stop offset="1" stop-color="#064a33"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f0fff8"/>
      <stop offset="1" stop-color="#5fd9a2"/>
    </radialGradient>
    <!-- Light catches the rim top-left, fades across, and returns softly bottom-right. -->
    <linearGradient id="rim" x1="0.15" y1="0.15" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="body" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </radialGradient>
    <clipPath id="tileClip"><rect width="64" height="64" rx="15"/></clipPath>
    <clipPath id="lens"><circle cx="30" cy="30" r="20"/></clipPath>
    <mask id="outside">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="30" cy="30" r="20" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <!-- Behind the glass: a soft sun, mostly hidden... -->
    <circle cx="50" cy="50" r="11" fill="url(#sun)" mask="url(#outside)"/>
    <!-- ...that the lens pulls inward and magnifies where it covers it. -->
    <g clip-path="url(#lens)">
      <circle cx="42" cy="42" r="13.5" fill="url(#sun)"/>
      <circle cx="30" cy="30" r="20" fill="url(#body)"/>
    </g>
  </g>
  <circle cx="30" cy="30" r="19" fill="none" stroke="url(#rim)" stroke-width="2.6"/>
</svg>
